# 1. 选择你的下载器接口
source [find interface/cmsis-dap.cfg]
transport select swd

# 2. 降低速度！1000kHz 有时对杜邦线不友好，降到 500
adapter speed 500

# 3. 选择芯片配置文件
source [find target/stm32h7x.cfg]

# 4. 关键：H743 经常因为复位配置不当导致无法 read IDR
# 尝试以下两种配置中的一种（先试第一种）：
reset_config none
# 如果不行，改用这句：reset_config srst_only srst_nogate